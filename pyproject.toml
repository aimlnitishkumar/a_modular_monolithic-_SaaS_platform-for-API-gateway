[project]
name = "meterflow"
version = "0.1.0"
description = "MeterFlow modular monolith foundation"
requires-python = ">=3.12,<3.14"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_test.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
